openapi: 3.0.2
info:
  title: metadata-api AWSAccount SampleData API
  version: '1.2'
tags:
- name: SampleData
paths:
  /api/v1/internal/sample_data/:
    get:
      tags:
      - SampleData
      summary: List Sample Data
      description: Get a list of all sample data
      operationId: get_samples_data_internal_api_v1_internal_sample_data__get
      parameters:
      - required: false
        schema:
          title: Is Active
          type: boolean
        name: is_active
        in: query
      - required: false
        schema:
          title: Is Public
          type: boolean
        name: is_public
        in: query
      - required: false
        schema:
          title: Aws Account Id
          type: integer
        name: aws_account_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Samples Data Internal Api V1 Internal Sample Data  Get
                type: array
                items:
                  $ref: '#/components/schemas/SampleDataOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - SampleData
      summary: Add Sample Data
      description: Add a new sample data
      operationId: create_sample_data_api_v1_internal_sample_data__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleDataCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/internal/sample_data/{sample_data_id}/:
    get:
      tags:
      - SampleData
      summary: Get Sample Data
      description: Get Sample Data details by id
      operationId: get_sample_data_internal_api_v1_internal_sample_data__sample_data_id___get
      parameters:
      - required: true
        schema:
          title: Sample Data Id
          type: integer
        name: sample_data_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    put:
