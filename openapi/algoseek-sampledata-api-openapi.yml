      - is_public
      - id
      - created
      - modified
      type: object
      properties:
        bucket_name:
          title: Bucket Name
          type: string
        display_name:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        aws_account_id:
          title: Aws Account Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
        id:
          title: Id
          type: integer
        created:
          title: Created
          type: string
          format: date-time
        modified:
          title: Modified
          type: string
          format: date-time
    ExtSampleDataOutAdmin:
      title: ExtSampleDataOutAdmin
      required:
      - id
      - is_active
      - is_public
      - created
      - modified
      type: object
      properties:
        bucket_name:
          title: Bucket Name
          type: string
        display_name:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        id:
