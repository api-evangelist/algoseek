      type: object
      properties:
        bucket_name:
          title: Bucket Name
          type: string
        display_name:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        id:
          title: Id
          type: integer
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    SampleDataCreate:
      title: SampleDataCreate
      type: object
      properties:
        bucket_name:
          title: Bucket Name
          type: string
        display_name:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        aws_account_id:
          title: Aws Account Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    SampleDataUpdate:
      title: SampleDataUpdate
      type: object
      properties:
        bucket_name:
          title: Bucket Name
          type: string
        display_name:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        aws_account_id:
          title: Aws Account Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
    EnumOutAdmin:
      title: EnumOutAdmin
      required:
      - text_id
      - internal_name
      - is_active
      - is_public
      - id
      - created
      - modified
      type: object
      properties:
        text_id:
          title: Text Id
          type: string
        display_name:
          title: Display Name
          type: string
        full_name:
          title: Full Name
          type: string
        description:
          title: Description
          type: string
        internal_name:
          title: Internal Name
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
        id:
          title: Id
          type: integer
        created:
          title: Created
          type: string
          format: date-time
        modified:
          title: Modified
          type: string
          format: date-time
  securitySchemes:
