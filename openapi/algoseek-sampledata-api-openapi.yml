      summary: Update sample data
      description: Update sample data details by id
      operationId: update_sample_data_api_v1_internal_sample_data__sample_data_id___put
      parameters:
      - required: true
        schema:
          title: Sample Data Id
          type: integer
        name: sample_data_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleDataUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - SampleData
      summary: Delete sample data
      description: Delete a sample data record
      operationId: delete_sample_data_api_v1_internal_sample_data__sample_data_id___delete
      parameters:
      - required: true
        schema:
          title: Sample Data Id
          type: integer
        name: sample_data_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/internal/sample_data/ext/{sample_data_id}/:
    get:
      tags:
