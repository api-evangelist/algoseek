aid: algoseek
url: https://raw.githubusercontent.com/api-evangelist/algoseek/refs/heads/main/apis.yml
name: AlgoSeek
kind: company
description: AlgoSeek, LLC is a New York-based financial market data vendor (spun
  off from a trading fund) selling historical intraday US market data - equities,
  ETFs, equity options with Greeks and IV, futures, futures options, and reference
  data (security masters, adjustment factors, IPOs, index components) - plus real-time
  feeds. Delivery is data-platform-first rather than API-first, through S3 flat-file
  buckets, the ArdaDB managed ClickHouse cloud database queried via the open-source
  algoseek-connector Python library, ultra-low-latency real-time feeds via colocated
  MultiCast/TCP, and a REST Metadata Services API with a public OpenAPI/Swagger surface.
  Sales-led commercially, with a customer console at console.algoseek.com.
