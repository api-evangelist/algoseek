          type: string
        sample_file_id:
          title: Sample File Id
          type: integer
        dataset_id:
          title: Dataset Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
        id:
          title: Id
