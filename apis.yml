    type: Documentation
  description: Managed ClickHouse-based columnar cloud database (AWS us-east-1) pre-loaded with two petabytes
    of AlgoSeek historical and near-real-time market data, queried with full SQL. Programmatic access
    is documented through the open-source algoseek-connector Python library (SQL-like method-chaining
    queries, pandas DataFrames, streaming results) using ArdaDB credentials; no public HTTP base URL is
    documented.
