openapi: 3.0.2
info:
  title: metadata-api AWSAccount DatabaseObject API
  version: '1.2'
tags:
- name: DatabaseObject
paths:
  /api/v1/internal/database_object/:
    get:
      tags:
      - DatabaseObject
      summary: List Database Objects
      description: Get a list of all database objects
      operationId: get_database_objects_internal_api_v1_internal_database_object__get
      parameters:
      - required: false
        schema:
          title: Is Active
          type: boolean
        name: is_active
        in: query
      - required: false
        schema:
          title: Is Public
          type: boolean
        name: is_public
        in: query
      - required: false
        schema:
          title: Status Id
          type: integer
        name: status_id
        in: query
      - required: false
        schema:
          title: Db Object Type Id
          type: integer
        name: db_object_type_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Database Objects Internal Api V1 Internal Database Object  Get
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseObjectOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - DatabaseObject
      summary: Add Database Object
      description: Add a new database object
      operationId: create_database_object_api_v1_internal_database_object__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseObjectCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
