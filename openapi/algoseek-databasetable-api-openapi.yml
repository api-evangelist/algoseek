          title: Db Object Type Id
          type: integer
        name: db_object_type_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Database Tables Internal Api V1 Internal Database Table  Get
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseTableOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
