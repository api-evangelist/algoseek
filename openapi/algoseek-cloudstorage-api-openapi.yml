      - required: false
        schema:
          title: Is Public
          type: boolean
        name: is_public
        in: query
      - required: false
        schema:
          title: Dataset Id
          type: integer
        name: dataset_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Cloud Storages Internal Api V1 Internal Cloud Storage  Get
                type: array
                items:
                  $ref: '#/components/schemas/CloudStorageOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
