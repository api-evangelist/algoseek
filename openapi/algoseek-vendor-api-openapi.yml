openapi: 3.0.2
info:
  title: metadata-api AWSAccount Vendor API
  version: '1.2'
tags:
- name: Vendor
paths:
  /api/v1/internal/vendor/:
    get:
      tags:
      - Vendor
      summary: List Vendors
      description: Get a list of all vendors
      operationId: get_vendors_internal_api_v1_internal_vendor__get
      parameters:
      - required: false
        schema:
          title: Is Active
          type: boolean
        name: is_active
        in: query
      - required: false
        schema:
          title: Is Public
          type: boolean
        name: is_public
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Vendors Internal Api V1 Internal Vendor  Get
                type: array
                items:
                  $ref: '#/components/schemas/VendorOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Vendor
      summary: Add vendor
      description: Add a new vendor
      operationId: create_vendor_api_v1_internal_vendor__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/internal/vendor/{vendor_id}/:
    get:
      tags:
      - Vendor
      summary: Get vendor
      description: Get vendor details by id
      operationId: get_vendor_internal_api_v1_internal_vendor__vendor_id___get
      parameters:
      - required: true
        schema:
          title: Vendor Id
          type: integer
        name: vendor_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    put:
      tags:
      - Vendor
      summary: Update vendor
      description: Update vendor details by id
      operationId: update_vendor_api_v1_internal_vendor__vendor_id___put
      parameters:
      - required: true
        schema:
          title: Vendor Id
          type: integer
        name: vendor_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Vendor
      summary: Delete vendor
      description: Delete a vendor record
      operationId: delete_vendor_api_v1_internal_vendor__vendor_id___delete
      parameters:
      - required: true
        schema:
          title: Vendor Id
          type: integer
        name: vendor_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/public/vendor/{vendor_id}/:
    get:
      tags:
      - Vendor
      summary: Get vendor
      description: Get vendor details by id
      operationId: get_vendor_public_api_v1_public_vendor__vendor_id___get
      parameters:
      - required: true
        schema:
          title: Vendor Id
          type: integer
        name: vendor_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOutPublic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/public/vendor/:
    get:
      tags:
      - Vendor
      summary: List vendors
      description: Get a list of all vendors
      operationId: get_vendors_public_api_v1_public_vendor__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Vendors Public Api V1 Public Vendor  Get
                type: array
                items:
                  $ref: '#/components/schemas/VendorOutPublic'
      security:
      - HTTPBearer: []
