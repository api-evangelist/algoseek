          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
          type: string
        id:
          title: Id
          type: integer
        created:
          title: Created
          type: string
          format: date-time
        modified:
          title: Modified
          type: string
          format: date-time
    BucketSourceUpdate:
      title: BucketSourceUpdate
      type: object
      properties:
        account_name:
          title: Account Name
          type: string
        resource_arn:
