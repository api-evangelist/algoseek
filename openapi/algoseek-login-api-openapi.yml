openapi: 3.2.0
info:
  title: metadata-api Login API
  version: '1.2'
tags:
- name: Login
paths:
  /api/v1/login/access_token/:
    post:
      tags:
      - Login
      summary: Apps Access Token
      operationId: apps_access_token_api_v1_login_access_token__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppsTokenQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    AppsTokenQuery:
      title: AppsTokenQuery
      required:
      - name
      - secret
      type: object
      properties:
        name:
          title: Name
          type: string
        secret:
          title: Secret
          type: string
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    Token:
      title: Token
      required:
      - token
      - expiry_date
      type: object
      properties:
        token:
          title: Token
          type: string
        expiry_date:
          title: Expiry Date
          type: string
          format: date-time
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
