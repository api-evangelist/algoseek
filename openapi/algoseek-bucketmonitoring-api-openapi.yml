      properties:
        delay_alert_minutes:
          title: Delay Alert Minutes
          type: integer
        timeout_minutes:
          title: Timeout Minutes
          type: integer
        check_period_minutes:
          title: Check Period Minutes
          type: integer
        is_active:
          title: Is Active
          type: boolean
        is_public:
          title: Is Public
          type: boolean
        notes:
          title: Notes
