      - DataGroup
      summary: List Data Group
      description: Get a list of all data groups
      operationId: get_data_groups_internal_api_v1_internal_data_group__get
      parameters:
      - required: false
        schema:
          title: Is Active
          type: boolean
        name: is_active
        in: query
      - required: false
        schema:
          title: Is Public
          type: boolean
        name: is_public
        in: query
      - required: false
        schema:
          title: Status Id
          type: integer
        name: status_id
        in: query
      - required: false
        schema:
          title: Region Id
          type: integer
        name: region_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Data Groups Internal Api V1 Internal Data Group  Get
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupOutAdmin'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - DataGroup
