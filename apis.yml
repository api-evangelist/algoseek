apis:
- aid: algoseek:algoseek-metadata-services-api
  name: AlgoSeek Metadata Services API
  tags:
  - Metadata
  - Datasets
  - Reference Data
  - Discovery
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://metadata-services.algoseek.com/docs
  baseURL: https://metadata-services.algoseek.com/api/v1
  properties:
  - url: https://metadata-services.algoseek.com/docs
    type: Documentation
  - url: openapi/algoseek-metadata-services-openapi.json
    type: OpenAPI
  description: FastAPI-based REST API (metadata-api v1.2) describing AlgoSeek's dataset
    catalog - data groups, datasets, pricing records, database objects and tables,
    cloud storage buckets, documentation, vendors, and sample data. Publishes a live
    Swagger UI and OpenAPI 3.0.2 document with 148 paths (56 public, 90 internal);
    endpoints require HTTP Bearer authentication obtained via /api/v1/login/access_token/.
    This is the metadata backend used by the algoseek-connector Python library.
- aid: algoseek:algoseek-ardadb-query-service
  name: AlgoSeek ArdaDB Query Service
  tags:
  - Database
  - SQL
  - ClickHouse
  - Historical Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://algoseek.com/ardadb
  baseURL: ''
  properties:
  - url: https://algoseek.com/ardadb
    type: Documentation
  - url: https://algoseek-connector.readthedocs.io/
    type: Documentation
  description: Managed ClickHouse-based columnar cloud database (AWS us-east-1) pre-loaded
    with two petabytes of AlgoSeek historical and near-real-time market data, queried
    with full SQL. Programmatic access is documented through the open-source algoseek-connector
    Python library (SQL-like method-chaining queries, pandas DataFrames, streaming
    results) using ArdaDB credentials; no public HTTP base URL is documented.
